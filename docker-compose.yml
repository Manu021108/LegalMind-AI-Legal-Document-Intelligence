services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network Ollama is reachable by service name
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./uploads:/app/uploads
      - ./vector_db:/app/vector_db
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot helper that pulls the required models before the app starts
  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} && ollama pull ${FALLBACK_LLM_MODEL:-llama3.2}
    restart: "no"

volumes:
  ollama_data:
